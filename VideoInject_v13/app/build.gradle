plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.videoinject'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.local.videoinject'
        minSdk 28
        targetSdk 34
        versionCode 12
        versionName '12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed/LSPosed API stand-in (compile only, the real one is provided by LSPosed at runtime)
    compileOnly project(':xposed-api')

    // Face finder that works offline (model is bundled in the APK). Used only inside the module app.
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
