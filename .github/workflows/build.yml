name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Find project root
        id: find
        run: |
          if [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "VideoInjectModule/settings.gradle" ]; then
            echo "dir=VideoInjectModule" >> "$GITHUB_OUTPUT"
          else
            found=$(find . -name "settings.gradle" -not -path "./.gradle/*" | head -1)
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle wrapper --gradle-version 8.7

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoInject-v13-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
